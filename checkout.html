<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout</title>

    <link rel="stylesheet" href="checkout.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">
            <a href="index.html">
           MY STORE 🪬
            </a>
        </div>

        <div class="secure">
            🔒 Secure Checkout
        </div>

    </header>


    <!-- CHECKOUT STEPS -->
    <section class="steps">

        <div class="step active">
            <span>1</span>
            <p>Checkout</p>
        </div>

        <div class="step-line"></div>

        <div class="step">
            <span>2</span>
            <p>Payment</p>
        </div>

        <div class="step-line"></div>

        <div class="step">
            <span>3</span>
            <p>Confirmation</p>
        </div>

    </section>


    <!-- MAIN -->
    <main>

        <!-- LEFT SIDE -->
        <section class="checkout-left">

            <!-- CONTACT INFORMATION -->
            <div class="checkout-box">

                <h2>Contact Information</h2>

                <div class="input-row">

                    <div class="input-group">
                        <label>Full Name *</label>

                        <input
                            type="text"
                            placeholder="Enter your full name"
                        >
                    </div>


                    <div class="input-group">
                        <label>Email Address *</label>

                        <input
                            type="email"
                            placeholder="Enter your email"
                        >
                    </div>

                </div>


                <div class="input-group">

                    <label>Phone Number *</label>

                    <input
                        type="tel"
                        placeholder="Enter your phone number"
                    >

                </div>

            </div>


            <!-- SHIPPING ADDRESS -->
            <div class="checkout-box">

                <h2>Shipping Address</h2>

                <div class="input-group">

                    <label>Address *</label>

                    <input
                        type="text"
                        placeholder="House number, street, area"
                    >

                </div>


                <div class="input-row">

                    <div class="input-group">

                        <label>City *</label>

                        <input
                            type="text"
                            placeholder="Enter city"
                        >

                    </div>


                    <div class="input-group">

                        <label>Pincode *</label>

                        <input
                            type="text"
                            placeholder="Enter pincode"
                        >

                    </div>

                </div>

            </div>


            <!-- PAYMENT -->
            <div class="checkout-box">

                <h2>Payment Method</h2>


                <label class="payment-option">

                    <input
                        type="radio"
                        name="payment"
                    >

                    <div class="payment-content">

                        <strong>UPI</strong>

                        <p>
                            Pay using Google Pay, PhonePe, Paytm, etc.
                        </p>

                    </div>

                    <span class="payment-icon">
                        UPI
                    </span>

                </label>


                <label class="payment-option">

                    <input
                        type="radio"
                        name="payment"
                    >

                    <div class="payment-content">

                        <strong>Credit / Debit Card</strong>

                        <p>
                            Visa, Mastercard, RuPay
                        </p>

                    </div>

                    <span class="payment-icon">
                        💳
                    </span>

                </label>


                <label class="payment-option">

                    <input
                        type="radio"
                        name="payment"
                    >

                    <div class="payment-content">

                        <strong>Cash on Delivery</strong>

                        <p>
                            Pay when your order arrives
                        </p>

                    </div>

                    <span class="payment-icon">
                        💵
                    </span>

                </label>

            </div>


            <button id="place-order">
                PLACE ORDER →
            </button>

        </section>


        <!-- RIGHT SIDE -->
        <section class="payment">



        </section>

    </main>
<script type="module" src="payment.js"></script>
</body>


</html>
